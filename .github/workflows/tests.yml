name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

# If a PR branch is pushed to, both `push` and `pull_request` fire for the
# same commit — this cancels the older, now-stale run instead of running
# the suite twice for nothing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        # pyproject declares requires-python >=3.10; the ends of the supported
        # range are what catch deprecations, so both are tested.
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Deliberately not `pip install -e .` — the project's base dependencies
      # include torch/pyannote.audio/faster-whisper (several GB, see the
      # disk-space note in README.md), which the current test suite doesn't
      # need at all (see "Running tests" in README.md). Installing just the
      # light runtime deps the tested modules actually import keeps CI fast.
      - name: Install test dependencies
        run: pip install pytest pyyaml numpy rich ruff

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest -v

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Scans requirements.txt for known CVEs. Doesn't install the heavy
      # torch/pyannote.audio/faster-whisper deps themselves — pip-audit reads
      # the pinned versions from the file directly.
      # PYSEC-2026-3624 / CVE-2026-58659 (RCE in lightning's _load_state) is
      # accepted, not fixed, because there is currently nothing to upgrade to:
      # lightning arrives transitively via pyannote.audio ("lightning>=2.4"),
      # every release up to and including the latest (2.6.5) is affected, and
      # the fix exists only as unreleased commit d710d68.
      #
      # Reaching the vulnerable path needs a malicious *checkpoint* to be fed
      # to LightningModule.load_from_checkpoint. This project loads exactly
      # two, both hardcoded in voxlib/diarization.py and both from official
      # gated pyannote repos on HuggingFace. Nothing a user supplies is ever a
      # checkpoint — their input is audio, which goes to ffmpeg and whisper.
      # Exploiting this would mean those repos were compromised, which is a
      # supply-chain problem much larger than this one CVE.
      #
      # Remove the flag (and re-pin lightning) as soon as a release containing
      # d710d68 exists.
      - name: Audit dependencies for known vulnerabilities
        run: pipx run pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-3624
