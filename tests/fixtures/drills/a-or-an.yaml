# A test fixture, not a real drill.
#
# The drills a person actually uses are built from their own recorded mistakes,
# which makes them personal data — `drills/` is gitignored for that reason. The
# engine still needs something committed to test itself against, so this file
# holds invented, textbook-level content that belongs to nobody.
name: a-or-an
category: Test Article Choice
target: '"a" or "an" before a common noun'
instructions: |
  Invented content. Say each sentence out loud, in order.

items:
  - prompt: I have / apple
    example: I have an apple.
    wrong: I have a apple.
    attempted: \bi have\s+(a\s+|an\s+)?apple\b
    correct: \bi have\s+an\s+apple\b

  - prompt: she has / umbrella
    example: She has an umbrella.
    wrong: She has a umbrella.
    attempted: \bshe has\s+(a\s+|an\s+)?umbrella\b
    correct: \bshe has\s+an\s+umbrella\b

  - prompt: he has / book
    example: He has a book.
    wrong: He has an book.
    attempted: \bhe has\s+(a\s+|an\s+)?book\b
    correct: \bhe has\s+a\s+book\b

  - prompt: we waited / hour
    example: We waited an hour.
    wrong: We waited a hour.
    attempted: \bwe waited\s+(a\s+|an\s+)?hour\b
    correct: \bwe waited\s+an\s+hour\b

  - prompt: they have / house
    example: They have a house.
    wrong: They have an house.
    attempted: \bthey have\s+(a\s+|an\s+)?house\b
    correct: \bthey have\s+a\s+house\b

  - prompt: I need / answer
    example: I need an answer.
    wrong: I need a answer.
    attempted: \bi need\s+(a\s+|an\s+)?answer\b
    correct: \bi need\s+an\s+answer\b

  - prompt: she wants / orange
