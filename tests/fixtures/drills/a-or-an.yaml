    attempted: \bwe saw\s+(a\s+|an\s+)?elephant\b
    correct: \bwe saw\s+an\s+elephant\b

  - prompt: I read / article
    example: I read an article.
    wrong: I read a article.
    attempted: \bi read\s+(a\s+|an\s+)?article\b
    correct: \bi read\s+an\s+article\b

  - prompt: she took / photo
    example: She took a photo.
    wrong: She took an photo.
    attempted: \bshe took\s+(a\s+|an\s+)?photo\b
    correct: \bshe took\s+a\s+photo\b

  - prompt: he told / story
    example: He told a story.
    wrong: He told an story.
    attempted: \bhe told\s+(a\s+|an\s+)?story\b
    correct: \bhe told\s+a\s+story\b

  - prompt: I ate / egg
    example: I ate an egg.
    wrong: I ate a egg.
    attempted: \bi ate\s+(a\s+|an\s+)?egg\b
    correct: \bi ate\s+an\s+egg\b

  - prompt: they built / bridge
    example: They built a bridge.
    wrong: They built an bridge.
    attempted: \bthey built\s+(a\s+|an\s+)?bridge\b
    correct: \bthey built\s+a\s+bridge\b

  - prompt: we watched / film
    example: We watched a film.
    wrong: We watched an film.
    attempted: \bwe watched\s+(a\s+|an\s+)?film\b
    correct: \bwe watched\s+a\s+film\b

  - prompt: she opened / envelope
    example: She opened an envelope.
    wrong: She opened a envelope.
    attempted: \bshe opened\s+(a\s+|an\s+)?envelope\b
